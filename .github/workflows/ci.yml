name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install && bun install --cwd skills/lakehouse/scripts
      - run: bun run check
      - run: bun test tests
      - run: uvx ruff check skills tests
      - run: uv run --python 3.12 --with pytest pytest -q tests
      - name: JSON manifests parse
        run: for f in .claude-plugin/*.json .codex-plugin/plugin.json .agents/plugins/marketplace.json skills/lakehouse/templates/.claude/settings.json; do jq -e . "$f" > /dev/null; done
      - name: Claude plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
